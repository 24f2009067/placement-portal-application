{% extends "base.html" %} {% block title %}Login{% endblock %} {% block
content %}
<div class="row h-100 justify-content-center align-items-center">
    <div class="col-md-6 col-lg-3">
        <div class="card shadow p-4">
            <h3 class="text-center mb-3">Login</h3>

            <form action="{{ url_for('auth.login') }}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="example@xyz.com"
                        required
                    />
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="********"
                        required
                    />
                </div>
                <button type="submit" class="btn btn-primary mb-3 w-100">
                    Login
                </button>
                <p class="text-center text-danger">{{ message }}</p>
                <p class="text-center text-secondary mb-0">
                    Do not have an account? Register as
                </p>
                <div
                    class="d-flex justify-content-center align-items-center gap-3"
                >
                    <a href="{{ url_for('auth.student_register') }}">Student</a>
                    <a href="{{ url_for('auth.company_register') }}">Company</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
