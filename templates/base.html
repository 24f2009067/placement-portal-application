<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
        <title>{% block title %}Placement Portal{% endblock %}</title>
    </head>
    <body class="d-flex flex-column vh-100">
        {% include "components/navbar.html" %}

        <div
            class="container-fluid flex-grow-1"
        >
            {% block content %}{% endblock %}
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

        <script>
            // theme switcher
            const themeSwitcher = document.querySelector("#themeSwitcher");
            const html = document.documentElement;
            const savedTheme = localStorage.getItem("theme");

            if (savedTheme) {
                html.setAttribute("data-bs-theme", savedTheme);
                if (savedTheme == "dark") themeSwitcher.src = "{{ url_for('static', filename='light_mode.svg') }}";
                else themeSwitcher.src = "{{ url_for('static', filename='dark_mode.svg') }}";
            }

            themeSwitcher.addEventListener("click", () => {
                const currentTheme = html.getAttribute("data-bs-theme");

                if (currentTheme === "dark") {
                    html.setAttribute("data-bs-theme", "light");
                    themeSwitcher.src = "{{ url_for('static', filename='dark_mode.svg') }}";
                    localStorage.setItem("theme", "light");
                } else {
                    html.setAttribute("data-bs-theme", "dark");
                    themeSwitcher.src = "{{ url_for('static', filename='light_mode.svg') }}";
                    localStorage.setItem("theme", "dark");
                }
            });
        </script>
    </body>
</html>
