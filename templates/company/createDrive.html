<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="../static/loginStyle.css" />
        <title>Create a Drive</title>
    </head>
    <body>
        <div
            class="container min-vh-100 d-flex align-items-center justify-content-center"
        >
            <div class="col-md-6 col-lg-4">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-3">Create a Drive</h3>

                    <form action="#">
                        <div class="mb-3">
                            <label class="form-label" for="driveName"
                                >Drive Name</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="driveName"
                            />
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="jobTitle"
                                >Job Title</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="jobTitle"
                            />
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="jobDiscription"
                                >Job Discription</label
                            >
                            <textarea name="" id="jobDiscription" class="form-control">

                            </textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="eligibilityCriteria"
                                >Eligibility Criteria</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="eligibilityCriteria"
                            />
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="applicationDeadline"
                                >Application Deadline</label
                            >
                            <input
                                type="date"
                                class="form-control"
                                id="applicationDeadline"
                            />
                        </div>

                        <button class="btn btn-success w-100 mt-4">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
